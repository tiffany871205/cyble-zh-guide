<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cyble Vision 繁體中文導覽</title>
  <meta name="description" content="Cyble Vision 繁體中文操作導覽：依功能分類理解 Threat Intelligence、Attack Surface、Third Party Risk、Vulnerability Intelligence 與 Control Panel。" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1f3a'/%3E%3Cpath d='M18 17h28v8H27v14h19v8H18z' fill='%23438cff'/%3E%3Ccircle cx='46' cy='17' r='6' fill='%232ed47a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css?v=2" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="mark">C</span>
        <div>
          <strong>Cyble 中文導覽</strong>
          <small>Vision Platform Guide</small>
          <a class="demo-link" href="https://tiffany871205.github.io/cyble-executive-insights-zh/" target="_blank" rel="noreferrer">開啟互動 Demo ↗</a>
        </div>
      </div>
      <label class="search-label" for="search">搜尋功能</label>
      <input id="search" type="search" placeholder="中文名稱或英文名稱" autocomplete="off" />
      <nav id="nav" aria-label="主要導覽"></nav>
      <div class="side-foot">獨立製作的學習與展示範例<br>非 Cyble 官方中文文件</div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button id="menuBtn" class="menu-btn" aria-controls="sidebar" aria-expanded="false">目錄</button>
        <div class="crumb" id="crumb">首頁</div>
        <div class="top-actions">
          <button id="tourBtn">使用說明</button>
          <a class="secondary" href="https://tiffany871205.github.io/cyble-executive-insights-zh/" target="_blank" rel="noreferrer">互動 Demo ↗</a>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="tour">
    <div class="dialog-head">
      <strong id="tourTitle"></strong>
      <button id="closeTour" aria-label="關閉">×</button>
    </div>
    <p id="tourText"></p>
    <div class="dialog-foot">
      <span id="tourStep"></span>
      <button id="prevTour">上一步</button>
      <button class="primary" id="nextTour">下一步</button>
    </div>
  </dialog>

  <script src="./script.js?v=5"></script>
</body>
</html>
